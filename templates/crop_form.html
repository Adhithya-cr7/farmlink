<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crop Recommendation - FarmLink</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
    <style>
      :root {
        --primary-color: #4caf50;
        --primary-light: #80e27e;
        --primary-dark: #087f23;
        --secondary-color: #8d6e63;
        --accent-color: #ff9800;
        --dark-color: #2c3e50;
        --light-color: #f8f9fa;
        --text-color: #333;
        --text-light: #6c757d;
        --white: #ffffff;
        --gradient: linear-gradient(
          135deg,
          var(--primary-color),
          var(--secondary-color)
        );
        --gradient-light: linear-gradient(
          135deg,
          rgba(76, 175, 80, 0.1),
          rgba(141, 110, 99, 0.1)
        );
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        --border-radius: 16px;
        --transition: all 0.3s ease;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: "Poppins", sans-serif;
        background: var(--gradient-light);
        min-height: 100vh;
        color: var(--text-color);
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem;
      }
      .container {
        max-width: 800px;
        width: 100%;
        background: var(--white);
        border-radius: var(--border-radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .header {
        background: var(--gradient);
        color: var(--white);
        padding: 2rem;
        text-align: center;
      }
      .header h1 {
        font-size: 2.2rem;
        margin-bottom: 0.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
      }
      .form-container {
        padding: 2.5rem;
      }
      .form-group {
        margin-bottom: 1.5rem;
      }
      .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1.5rem;
      }
      .full-width {
        grid-column: 1 / -1;
      }
      label {
        display: block;
        margin-bottom: 0.5rem;
        font-weight: 500;
        color: var(--dark-color);
      }
      .input-group {
        position: relative;
      }
      input,
      select {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 2px solid #e0e0e0;
        border-radius: var(--border-radius);
        font-size: 1rem;
        font-family: "Poppins", sans-serif;
      }
      input:focus,
      select:focus {
        outline: none;
        border-color: var(--primary-color);
        box-shadow: 0 0 0 3px rgba(76, 175, 80, 0.2);
      }
      .input-icon {
        position: absolute;
        right: 1rem;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-light);
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: var(--gradient);
        color: var(--white);
        border: none;
        padding: 1rem 2rem;
        border-radius: var(--border-radius);
        font-size: 1.1rem;
        font-weight: 600;
        cursor: pointer;
        width: 100%;
        margin-top: 1rem;
      }
      .back-link {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        color: var(--primary-color);
        text-decoration: none;
        margin-top: 1.5rem;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1><i class="fas fa-seedling"></i> Crop Recommendation</h1>
        <p>
          Select a state for regional top crops OR enter soil data for a
          specific prediction.
        </p>
      </div>

      <div class="form-container">
        {% with messages = get_flashed_messages(category_filter=["warning"]) %}
        {% if messages %}
        <div
          style="
            color: #ff9800;
            background: #fff3e0;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
          "
        >
          {{ messages[0] }}
        </div>
        {% endif %} {% endwith %}

        <form method="POST" action="/crop_recommendation">
          <div class="form-row">
            <div class="form-group full-width">
              <label for="state"
                >Select State (Optional if entering soil data)</label
              >
              <div class="input-group">
                <select id="state" name="state">
                  <option value="">-- Select a State --</option>
                  <option value="Andhra Pradesh">Andhra Pradesh</option>
                  <option value="Arunachal Pradesh">Arunachal Pradesh</option>
                  <option value="Assam">Assam</option>
                  <option value="Bihar">Bihar</option>
                  <option value="Chhattisgarh">Chhattisgarh</option>
                  <option value="Goa">Goa</option>
                  <option value="Gujarat">Gujarat</option>
                  <option value="Haryana">Haryana</option>
                  <option value="Himachal Pradesh">Himachal Pradesh</option>
                  <option value="Jharkhand">Jharkhand</option>
                  <option value="Karnataka">Karnataka</option>
                  <option value="Kerala">Kerala</option>
                  <option value="Madhya Pradesh">Madhya Pradesh</option>
                  <option value="Maharashtra">Maharashtra</option>
                  <option value="Manipur">Manipur</option>
                  <option value="Meghalaya">Meghalaya</option>
                  <option value="Mizoram">Mizoram</option>
                  <option value="Nagaland">Nagaland</option>
                  <option value="Odisha">Odisha</option>
                  <option value="Punjab">Punjab</option>
                  <option value="Rajasthan">Rajasthan</option>
                  <option value="Sikkim">Sikkim</option>
                  <option value="Tamil Nadu">Tamil Nadu</option>
                  <option value="Telangana">Telangana</option>
                  <option value="Tripura">Tripura</option>
                  <option value="Uttar Pradesh">Uttar Pradesh</option>
                  <option value="Uttarakhand">Uttarakhand</option>
                  <option value="West Bengal">West Bengal</option>
                  <option value="Andaman and Nicobar Islands">
                    Andaman and Nicobar Islands
                  </option>
                  <option value="Chandigarh">Chandigarh</option>
                  <option value="Dadra and Nagar Haveli and Daman and Diu">
                    Dadra and Nagar Haveli and Daman and Diu
                  </option>
                  <option value="Delhi">Delhi</option>
                </select>
                <i class="fas fa-map-marker-alt input-icon"></i>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="N">Nitrogen (N)</label>
              <div class="input-group">
                <input type="number" step="any" id="N" name="N" />
                <i class="fas fa-flask input-icon"></i>
              </div>
            </div>

            <div class="form-group">
              <label for="P">Phosphorous (P)</label>
              <div class="input-group">
                <input type="number" step="any" id="P" name="P" />
                <i class="fas fa-flask input-icon"></i>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="K">Potassium (K)</label>
              <div class="input-group">
                <input type="number" step="any" id="K" name="K" />
                <i class="fas fa-flask input-icon"></i>
              </div>
            </div>

            <div class="form-group">
              <label for="temperature">Temperature (°C)</label>
              <div class="input-group">
                <input
                  type="number"
                  step="any"
                  id="temperature"
                  name="temperature"
                />
                <i class="fas fa-thermometer-half input-icon"></i>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="humidity">Humidity (%)</label>
              <div class="input-group">
                <input type="number" step="any" id="humidity" name="humidity" />
                <i class="fas fa-tint input-icon"></i>
              </div>
            </div>

            <div class="form-group">
              <label for="ph">pH Level</label>
              <div class="input-group">
                <input type="number" step="any" id="ph" name="ph" />
                <i class="fas fa-vial input-icon"></i>
              </div>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="rainfall">Rainfall (mm)</label>
              <div class="input-group">
                <input type="number" step="any" id="rainfall" name="rainfall" />
                <i class="fas fa-cloud-rain input-icon"></i>
              </div>
            </div>

            <div class="form-group">
              <label for="moisture">Moisture (%)</label>
              <div class="input-group">
                <input type="number" step="any" id="moisture" name="moisture" />
                <i class="fas fa-tint input-icon"></i>
              </div>
            </div>
          </div>

          <button type="submit" class="btn">
            <i class="fas fa-chart-line"></i> Predict Crop
          </button>
        </form>

        <a href="/" class="back-link">
          <i class="fas fa-arrow-left"></i> Back to Home
        </a>
      </div>
    </div>
  </body>
</html>
